// ---------------- PROCEDURAL NAVIGATION ENGINE ----------------
// getRoom() checks dynamically-generated junctions and the two content
// pools before falling back to the tiny static ROOMS object (just 'start'
// and 'respite' now — everything else is assembled at play-time).
function getRoom(id){
  return state.dynamicRooms[id] || ROOM_POOL[id] || BOSS_POOL[id] || ROOMS[id];
}

function pickRandomUnusedRooms(count){
  // Only permanently-used (actually entered) rooms are excluded. A room can
  // briefly appear as an option at more than one open junction if the
  // player never revisits some of them — harmless, since pickBranch()
  // retires any duplicate the moment one copy is actually entered, so a
  // room can never really be played twice.
  const available = Object.keys(ROOM_POOL).filter(id => !state.usedRoomIds.has(id));
  const shuffled = available.slice().sort(()=>Math.random()-0.5);
  return shuffled.slice(0, Math.min(count, available.length));
}

// Builds a junction as a synthetic 'flavor' room (reuses all the existing
// door-diagram rendering) with 2-3 freshly-drawn, never-before-seen rooms
// as its branches. Fog of war: only the color is shown, never the name.
function generateJunction(parentId){
  const branchCount = 2 + Math.floor(Math.random()*2); // 2 or 3, varies each time
  const roomIds = pickRandomUnusedRooms(branchCount);
  const branches = roomIds.map(id => ({ color: ROOM_POOL[id].color, roomId:id, cleared:false }));
  const jid = 'junction'+(state.junctionCounter++);
  state.junctions[jid] = { branches, parentId: parentId||null };
  refreshJunctionRoom(jid);
  return jid;
}

// (Re)builds the synthetic room object for a junction from its live branch
// state — called both at creation and whenever we return to it via "go
// back", so cleared branches drop out of the choices automatically.
function refreshJunctionRoom(jid){
  const j = state.junctions[jid];
  const liveDoors = j.branches
    .map((b,i)=> b.cleared ? null : { color: b.color, next: `__BRANCH__${jid}__${i}` })
    .filter(Boolean);
  state.dynamicRooms[jid] = {
    mapName:"Crossing", tag:"A CROSSING",
    text: liveDoors.length
      ? "Passages lead onward, unmarked and unlit."
      : "Every path from here has already been walked. Only the way back remains.",
    kind:'flavor',
    doors: liveDoors,
    _isJunction:true, _junctionId:jid, _parentJunctionId:j.parentId,
  };
}

function enterJunction(jid){
  refreshJunctionRoom(jid);
  state.currentRoomId = jid;
  state.visitedRooms.add(jid);
  state.view = 'room';
  render();
}

function pickBranch(jid, branchIndex){
  const branch = state.junctions[jid].branches[branchIndex];
  if(!branch || branch.cleared) return;
  state.usedRoomIds.add(branch.roomId);
  // if this same room happens to also be sitting unresolved at another
  // open junction (rare, only possible with heavy backtracking), quietly
  // retire it there too — you don't get to fight the same room twice
  Object.entries(state.junctions).forEach(([otherJid, j])=>{
    if(otherJid === jid) return;
    j.branches.forEach(b=>{ if(b.roomId === branch.roomId && !b.cleared) b.cleared = true; });
  });
  state.pendingBranch = { jid, branchIndex };
  enterRoom(branch.roomId);
}

// After any pool room is cleared: mark its branch done, bump the counter,
// and route to Respite (after 7), the random Boss (after 14), or a new
// junction — all without the player choosing anything extra.
function handleDynamicProgress(){
  const pendingJid = state.pendingBranch ? state.pendingBranch.jid : null;
  if(state.pendingBranch){
    state.junctions[state.pendingBranch.jid].branches[state.pendingBranch.branchIndex].cleared = true;
    state.pendingBranch = null;
  }
  state.roomsCleared++;
  if(state.roomsCleared === 7){
    enterRoom('respite');
  } else if(state.roomsCleared === 14){
    const bossIds = Object.keys(BOSS_POOL);
    state.chosenBossId = bossIds[Math.floor(Math.random()*bossIds.length)];
    enterRoom(state.chosenBossId);
  } else {
    const jid = generateJunction(pendingJid);
    enterJunction(jid);
  }
}

function enterRoom(id){
  SFX.doorLock();
  state.currentRoomId = id;
  state.visitedRooms.add(id);
  state.lastTrapNote = null;
  livingParty().forEach(p=>{
    if(p.maxFp) p.fp = Math.min(p.maxFp, p.fp + 2);
    if(p.maxHp) p.hp = Math.min(p.maxHp, p.hp + 2);
  });
  const room = getRoom(id);
  if(room.kind==='chest'){
    const hasMimic = Math.random() < (room.mimicChance||0.2);
    state._chestMimicIndex = hasMimic ? Math.floor(Math.random()*3) : -1;
  }
  if(room.kind==='respite'){
    livingParty().forEach(p=>{ p.hp = p.maxHp; p.fp = p.maxFp; });
  }
  if(room.trap && !state.triggeredTraps.has(id)){
    state.triggeredTraps.add(id);
    if(Math.random() < room.trap.chance){
      const alive = livingParty();
      if(alive.length){
        if(room.trap.target==='all'){
          alive.forEach(p=>{
            p.hp -= rollDice(room.trap.dmg);
            if(p.hp<=0){ p.hp=0; p.alive=false; }
          });
        } else {
          const victim = alive[Math.floor(Math.random()*alive.length)];
          victim.hp -= rollDice(room.trap.dmg);
          if(victim.hp<=0){ victim.hp=0; victim.alive=false; }
        }
        state.runLog.push(room.trap.hitNote);
        state.lastTrapNote = room.trap.hitNote;
        SFX.trap();
      }
    } else {
      state.runLog.push(room.trap.missNote);
      state.lastTrapNote = room.trap.missNote;
    }
  }
  state.view='room';
  if(room.kind==='combat'){
    startCombat(room.monsters(), room);
    state.view='combat';
  }
  render();
}

function renderRoom(){
  const room = getRoom(state.currentRoomId);
  if(room.kind==='flavor'){
    const exitHTML = room.doors ? doorButtonsHTML(room.doors) : `<button class="big-btn" id="advBtn">${room.advanceLabel || 'Begin'}</button>`;
    const backHTML = (room._isJunction && room._parentJunctionId)
      ? `<button class="big-btn alt" id="goBackBtn" style="margin-top:10px;">← Go Back</button>` : '';
    app.innerHTML = `${partyBarHTML()}${progressHTML()}<div class="panel" data-tag="${roomDisplayTag(room)}">
      ${roomHeaderHTML(room)}
      <div class="scene-text">${roomIntroText(room)}</div>
      ${exitHTML}
      ${backHTML}
    </div>`;
    attachProgressHandlers();
    if(room.doors){ attachDoorButtons(room.doors); }
    else { document.getElementById('advBtn').onclick = ()=>{ goNext(room.next); }; }
    if(backHTML){ document.getElementById('goBackBtn').onclick = ()=>{ goNext('__BACK__'+room._parentJunctionId); }; }
    return;
  }
  if(room.kind==='choice'){
    app.innerHTML = `${partyBarHTML()}${progressHTML()}<div class="panel" data-tag="${roomDisplayTag(room)}">
      ${roomHeaderHTML(room)}
      <div class="scene-text">${roomIntroText(room)}</div>
      <div id="choiceRows"></div>
    </div>`;
    attachProgressHandlers();
    const rows = document.getElementById('choiceRows');
    rows.innerHTML = room.options.map((o,i)=>`<button class="big-btn" data-i="${i}" style="margin-top:10px;">${o.label}</button>`).join('');
    room.options.forEach((o,i)=>{
      rows.querySelector(`button[data-i="${i}"]`).onclick = ()=>{ goNext(o.next); };
    });
    return;
  }
  if(room.kind==='skillcheck'){
    app.innerHTML = `${partyBarHTML()}${progressHTML()}<div class="panel" data-tag="${roomDisplayTag(room)}">
      ${roomHeaderHTML(room)}
      <div class="scene-text">${roomIntroText(room)}</div>
      <button class="big-btn" id="tryBtn">Attempt It</button>
    </div>`;
    attachProgressHandlers();
    document.getElementById('tryBtn').onclick = ()=>{
      const champion = livingParty().sort((a,b)=>b[room.stat]-a[room.stat])[0];
      const roll = 2*rollDie(6) + champion[room.stat] - 8; // scaled check
      const passed = roll >= room.tn;
      const lines = [passed ? room.passNote : room.failNote];
      state.runLog.push(passed ? room.passNote : room.failNote);
      if(!passed && room.failDamage){
        const victim = livingParty()[Math.floor(Math.random()*livingParty().length)];
        victim.hp -= rollDice(room.failDamage);
        if(victim.hp<=0){ victim.hp=0; victim.alive=false; state.runLog.push(`${victim.name} does not get back up.`); lines.push(`${victim.name} does not get back up.`); }
        else lines.push(`${victim.name} takes damage from the mishap.`);
      }
      if(passed){
        if(room.goldOnPass){ const g=rollDice(room.goldOnPass); addGold(g); state.runLog.push(`+${g} gold.`); lines.push(`Found ${g} gold.`); }
        if(room.gemsOnPass){ const gm=rollDice(room.gemsOnPass); addGems(gm); state.runLog.push(`+${gm} gems.`); lines.push(`Found ${gm} gems.`); }
        if(room.itemOnPass){ addItem(room.itemOnPass); state.runLog.push(`Found: ${ITEMS[room.itemOnPass].name}.`); lines.push(`Found: ${ITEMS[room.itemOnPass].name}.`); }
      }
      showRoomClear(passed ? "PASSED" : "SETBACK", lines, room.next, room.doors);
    };
    return;
  }
  if(room.kind==='chest'){
    app.innerHTML = `${partyBarHTML()}${progressHTML()}<div class="panel" data-tag="${roomDisplayTag(room)}">
      ${roomHeaderHTML(room)}
      <div class="scene-text">${roomIntroText(room)}</div>
      <div class="small" style="text-align:center;margin:10px 0 4px;opacity:0.75;">Three chests. Pick one.</div>
      <div style="text-align:center;">${chestRoomSVG()}</div>
    </div>`;
    attachProgressHandlers();
    document.querySelectorAll('.chest-room-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.i);
        const isMimic = i === state._chestMimicIndex;
        if(isMimic){
          state.runLog.push(room.mimicText || "It wasn't a chest at all.");
          startCombat(room.mimicMonsters(), {...room, text: room.mimicText || room.text});
          state.view='combat';
          render();
          return;
        }
        const lines = [];
        if(room.gold){ const g=rollDice(room.gold); addGold(g); state.runLog.push(`+${g} gold.`); lines.push(`Found ${g} gold.`); }
        if(room.gems){ const gm=rollDice(room.gems); addGems(gm); state.runLog.push(`+${gm} gems.`); lines.push(`Found ${gm} gems.`); }
        if(room.item){ addItem(room.item); state.runLog.push(`Found: ${ITEMS[room.item].name}.`); lines.push(`Found: ${ITEMS[room.item].name}.`); }
        if(!lines.length) lines.push("Empty. Someone beat you to it.");
        showRoomClear("CHEST OPENED", lines, room.next, room.doors);
      };
    });
    return;
  }
  if(room.kind==='respite'){
    const shopRows = SHOP_ITEMS.map(s=>{
      const item = ITEMS[s.key];
      const funds = s.currency==='gold' ? state.gold : state.gems;
      const afford = funds >= s.price;
      const symbol = s.currency==='gold' ? 'gold' : 'gems';
      return `<div class="small" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #3a322a;">
        <div><b>${item.name}</b><br><span style="opacity:0.7;">${item.desc}</span></div>
        <button class="small-btn shopBuyBtn" data-key="${s.key}" ${afford?'':'disabled'} style="white-space:nowrap;${afford?'':'opacity:0.4;cursor:not-allowed;'}">${s.price} ${symbol}</button>
      </div>`;
    }).join('');
    app.innerHTML = `${partyBarHTML()}${goldBarHTML()}${progressHTML()}<div class="panel" data-tag="${roomDisplayTag(room)}">
      ${roomHeaderHTML(room)}
      <div class="scene-text">${roomIntroText(room)}</div>
      <div class="small" style="margin-top:10px;color:var(--gold);">Your party rests here — everyone is fully healed.</div>
      <div style="margin-top:14px;"><div class="small" style="opacity:0.75;text-transform:uppercase;letter-spacing:1px;">Shop</div>${shopRows}</div>
      <button class="big-btn" id="respiteContinueBtn" style="margin-top:16px;">Leave the Respite</button>
    </div>`;
    attachProgressHandlers();
    document.querySelectorAll('.shopBuyBtn').forEach(btn=>{
      btn.onclick = ()=>{ if(buyItem(btn.dataset.key)) render(); };
    });
    document.getElementById('respiteContinueBtn').onclick = ()=>{ goNext(room.next); };
    return;
  }
}

function showRoomClear(title, lines, next, doors){
  state.view='clear';
  state.clearInfo = { title, lines, next, doors };
  if(title!=='SETBACK') SFX.loot();
  render();
}

function usableOutOfCombatItems(){
  return Object.keys(state.inventory).filter(k=> ['heal','revive'].includes(ITEMS[k].kind));
}

function applyOutOfCombatItem(itemKey, targetName){
  const item = ITEMS[itemKey];
  const target = state.party.find(p=>p.name===targetName);
  if(!item || !target || !state.inventory[itemKey]) return;
  if(item.kind==='heal'){
    if(!target.alive) return;
    const heal = rollDice(item.heal);
    target.hp = Math.min(target.maxHp, target.hp+heal);
    state.runLog.push(`Used ${item.name} on ${target.name}, restoring ${heal}.`);
  } else if(item.kind==='revive'){
    if(target.alive) return;
    const heal = rollDice(item.heal);
    target.alive = true;
    target.hp = Math.min(target.maxHp, heal);
    state.runLog.push(`Used ${item.name} on ${target.name} — they're back on their feet, ${target.hp} HP.`);
  }
  removeItem(itemKey);
  SFX.potion();
  render();
}

function itemPanelHTML(){
  const usable = usableOutOfCombatItems();
  if(!usable.length) return '';
  const rows = usable.map(k=>{
    const item = ITEMS[k];
    const eligible = item.kind==='revive'
      ? state.party.slice(0,state.activeCount).filter(p=>!p.alive)
      : state.party.slice(0,state.activeCount).filter(p=>p.alive && p.hp<p.maxHp);
    if(!eligible.length) return '';
    return `<div class="small" style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <span>${item.name} x${state.inventory[k]}</span>
      <select class="ocTarget" data-item="${k}">${eligible.map(p=>`<option value="${p.name}">${p.name}</option>`).join('')}</select>
      <button class="small-btn ocUseBtn" data-item="${k}">Use</button>
    </div>`;
  }).filter(Boolean).join('');
  return rows ? `<div class="panel" style="margin-top:12px;"><div class="small" style="opacity:0.75;">Items</div>${rows}</div>` : '';
}

function attachItemPanel(){
  document.querySelectorAll('.ocUseBtn').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.item;
      const sel = document.querySelector(`.ocTarget[data-item="${key}"]`);
      applyOutOfCombatItem(key, sel.value);
    };
  });
}

function renderClear(){
  const info = state.clearInfo;
  const exitHTML = info.doors ? doorButtonsHTML(info.doors) : `<button class="big-btn" id="continueBtn">Continue Onward</button>`;
  app.innerHTML = `${partyBarHTML()}${goldBarHTML()}<div class="panel" data-tag="room cleared">
    <div class="ending-title ${info.title==='SETBACK'?'bad':'good'}" style="font-size:20px;">${info.title}</div>
    <div class="scene-text" style="margin-top:6px;">${info.lines.map(l=>'• '+l).join('<br>')}</div>
    ${exitHTML}
  </div>${itemPanelHTML()}`;
  if(info.doors){ attachDoorButtons(info.doors); }
  else { document.getElementById('continueBtn').onclick = ()=>{ goNext(info.next); }; }
  attachItemPanel();
}

function goNext(next){
  if(!next){ console.error('goNext called with no destination — this is a content bug, staying put.'); return; }
  if(next==='end'){ state.view='end'; render(); return; }
  if(next==='__FIRST_JUNCTION__'){
    const jid = generateJunction(null);
    enterJunction(jid);
    return;
  }
  if(next==='__DYNAMIC__'){
    handleDynamicProgress();
    return;
  }
  if(next.startsWith('__BRANCH__')){
    const parts = next.slice('__BRANCH__'.length).split('__');
    pickBranch(parts[0], parseInt(parts[1]));
    return;
  }
  if(next.startsWith('__BACK__')){
    const jid = next.slice('__BACK__'.length);
    refreshJunctionRoom(jid);
    enterJunction(jid);
    return;
  }
  enterRoom(next);
}

// A real, spatial little room for the chest encounter — reuses the same
// hex-tile geometry and token rendering as combat, but is fully standalone
// (no state.combat involved) since it's just 3 clickable chest tokens.
function chestRoomSVG(){
  const grid = {w:7, h:3};
  const {w,h} = gridPixelSize(grid);
  const tileR = HEX_R;
  const TOP_PAD = 20;
  let out = `<svg class="gridsvg" viewBox="0 -${TOP_PAD} ${w} ${h+TOP_PAD}" width="${w}" height="${h+TOP_PAD}">`;
  for(let y=0;y<grid.h;y++){
    for(let x=0;x<grid.w;x++){
      const {cx,cy} = hexCenter(x,y);
      out += `<polygon points="${hexPoints(cx,cy,tileR)}" fill="#181310" stroke="#000" stroke-opacity="0.4"/>`;
    }
  }
  const chestPositions = [{x:1,y:1},{x:3,y:1},{x:5,y:1}];
  chestPositions.forEach((pos,i)=>{
    const {px,py} = hexTopLeft(pos.x, pos.y);
    out += `<g class="chest-room-btn" data-i="${i}" style="cursor:pointer;">${drawToken('chest', px, py, TILE, 1, true, 'contain')}</g>`;
  });
  out += `</svg>`;
  return out;
}

function buildGridSVG(){
  const c = state.combat;
  const grid = c.grid;
  const {w,h} = gridPixelSize(grid);
  const obstacles = obstacleSet();
  const reach = c.selectedMercId!=null ? c._reachableSet : null;
  const tileR = HEX_R; // hexes touch edge-to-edge on their flat sides, no gap
  const TOP_PAD = 46; // room for 2x boss-scale tokens' heads when they're in the top row
  let out = `<svg class="gridsvg" viewBox="0 -${TOP_PAD} ${w} ${h+TOP_PAD}" width="${w}" height="${h+TOP_PAD}">`;
  for(let y=0;y<grid.h;y++){
    for(let x=0;x<grid.w;x++){
      const k = `${x},${y}`;
      const isObstacle = obstacles.has(k);
      const feat = featureAt(x,y);
      const {cx:tcx, cy:tcy} = hexCenter(x,y);
      const fill = feat ? feat.color : (isObstacle ? '#2a2018' : '#181310');
      out += `<polygon points="${hexPoints(tcx,tcy,tileR)}" fill="${fill}" stroke="#000" stroke-opacity="0.4"/>`;
      if(reach && reach.has(k)){
        out += `<polygon class="reachTile" data-x="${x}" data-y="${y}" points="${hexPoints(tcx,tcy,tileR*0.92)}" fill="#c9a227" fill-opacity="0.28" style="cursor:pointer;"/>`;
      }
    }
  }
  // fallen monsters — shown as skull markers rather than vanishing
  c.monsters.filter(mo=>!mo.alive).forEach(mo=>{
    const {px,py} = hexTopLeft(mo.pos.x, mo.pos.y);
    out += `<g opacity="0.6">${drawToken('fallen', px, py, TILE, 1, false, 'contain')}</g>`;
  });
  livingMonsters().forEach(mo=>{
    const spr = spriteFor(mo, false);
    const {px,py} = hexTopLeft(mo.pos.x, mo.pos.y);
    out += drawToken(spr.icon, px, py, TILE, spr.scale, spr.ally);
  });
  // fallen party members
  state.party.slice(0,state.activeCount).filter(p=>!p.alive && p._pos).forEach(p=>{
    const {px,py} = hexTopLeft(p._pos.x, p._pos.y);
    out += `<g opacity="0.6">${drawToken('fallen', px, py, TILE, 1, true, 'contain')}</g>`;
  });
  livingParty().forEach(m=>{
    const pos = c.pendingMoves[m.id] || m._pos;
    const spr = spriteFor(m, true);
    const sel = c.selectedMercId===m.id;
    const {px,py} = hexTopLeft(pos.x, pos.y);
    out += `<rect x="${px+2}" y="${py+2}" width="${TILE-4}" height="${TILE-4}" fill="none" stroke="${sel?'#c9a227':'transparent'}" stroke-width="2"/>`;
    out += drawToken(spr.icon, px, py, TILE, spr.scale, spr.ally);
    out += initialBadge(m.name, px, py, TILE);
    out += `<rect class="tokenTile" data-merc="${m.id}" x="${px}" y="${py}" width="${TILE}" height="${TILE}" fill="transparent" style="cursor:pointer;"/>`;
  });
  out += `</svg>`;
  return out;
}

function renderCombat(){
  const c = state.combat;
  const mercs = livingParty();
  const mons = c.monsters;
  const usableItems = Object.keys(state.inventory).filter(k=> ['heal','revive','partybuff','buff_hit','buff_def','buff_dmg','restore_focus'].includes(ITEMS[k].kind));

  app.innerHTML = `
    ${partyBarHTML()}
    ${goldBarHTML()}
    <div class="panel" data-tag="${roomDisplayTag(getRoom(state.currentRoomId))}">
      <div class="gridhint">Click a mercenary token, then a highlighted tile to move once this turn (armor may reduce your reach). Ranged weapons and bows strike up to ${RANGED_RANGE} squares away; melee needs you adjacent.</div>
      <div class="combatLayout">
        <div class="boardPane">
          <div class="gridwrap">${buildGridSVG()}</div>

          <div class="combatgrid">
            ${mons.map(mo=>{
              const pct = Math.max(0,Math.round((mo.hp/mo.maxHp)*100));
              return `<div class="mon ${mo.alive?'':'dead'}">
                <div class="nm">${mo.name}${mo.alive?'':' — slain'}</div>
                <div class="small">HP ${Math.max(0,mo.hp)}/${mo.maxHp}</div>
                <div class="bar"><div style="width:${pct}%;background:var(--blood)"></div></div>
              </div>`;
            }).join('')}
          </div>

          <div id="actionRows"></div>
          <button class="big-btn" id="resolveBtn">End Turn</button>
        </div>
        <div class="logPane">
          <div class="small" style="letter-spacing:1px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:6px;">Battle Log</div>
          <div class="log">${c.log.slice(-40).map(l=> l.startsWith('__ROUND__') ? `<div class="roundMark">— Round ${l.replace('__ROUND__','')} —</div>` : '· '+l).join('<br>')}</div>
        </div>
      </div>
    </div>
  `;

  // grid interactions
  document.querySelectorAll('.tokenTile').forEach(el=>{
    el.onclick = ()=>{
      const id = parseInt(el.dataset.merc);
      const m = state.party.find(p=>p.id===id);
      if(!m || !m.alive) return;
      c.selectedMercId = id;
      const baseMove = Math.max(1, MOVE_SPEED - (ARMORS[m.armor].moveMalus||0) - (isEncumbered()?1:0));
      const effMove = terrainMoveSpeed(baseMove, m._pos, m);
      c._reachableSet = new Set(reachableTiles(m._pos, effMove).map(tileKey));
      renderCombat();
    };
  });
  document.querySelectorAll('.reachTile').forEach(el=>{
    el.onclick = ()=>{
      if(c.selectedMercId==null) return;
      const x = parseInt(el.dataset.x), y = parseInt(el.dataset.y);
      c.pendingMoves[c.selectedMercId] = {x,y};
      c.selectedMercId = null;
      c._reachableSet = null;
      renderCombat();
    };
  });

  const rowsEl = document.getElementById('actionRows');
  mercs.forEach(m=>{ if(!c.actions[m.id]) c.actions[m.id] = {type:'attack'}; });
  rowsEl.innerHTML = mercs.map(m=>{
    const slots = spellSlots(m);
    const canMagic = canCast(m) && m.spells.length>0;
    const moving = c.pendingMoves[m.id] ? ` <span class="small">(moving)</span>` : '';
    const clsName = m.cls==='wizard' ? 'Wizard' : 'Fighter';
    const selected = c.selectedMercId===m.id;
    const draftType = c.actions[m.id].type;
    return `<div class="actionrow ${selected?'rowSelected':''}" data-merc="${m.id}">
      <div class="nm">${m.name} <span class="small" style="color:var(--gold);">(${clsName})</span>${moving} <span class="small">(HP ${m.hp}/${m.maxHp}${m.maxFp?`, Focus ${m.fp}/${m.maxFp}`:''})</span></div>
      <select class="actType">
        <option value="attack" ${draftType==='attack'?'selected':''}>Attack</option>
        ${canMagic?`<option value="cast" ${draftType==='cast'?'selected':''}>Cast Spell</option>`:''}
        ${usableItems.length?`<option value="item" ${draftType==='item'?'selected':''}>Use Item</option>`:''}
        <option value="defend" ${draftType==='defend'?'selected':''}>Defend (+4 Defense)</option>
      </select>
      <select class="actTarget"></select>
      <select class="actWeapon" style="display:none;"></select>
      <select class="actSpell" style="display:none;"></select>
      <select class="actItem" style="display:none;"></select>
    </div>`;
  }).join('');

  mercs.forEach(m=>{
    const row = rowsEl.querySelector(`.actionrow[data-merc="${m.id}"]`);
    const typeSel = row.querySelector('.actType');
    const targetSel = row.querySelector('.actTarget');
    const weaponSel = row.querySelector('.actWeapon');
    const spellSel = row.querySelector('.actSpell');
    const itemSel = row.querySelector('.actItem');
    const effPos = c.pendingMoves[m.id] || m._pos;
    const draft = c.actions[m.id];
    const hasRangedPrimary = WEAPONS[m.weapon].ranged;

    function currentWeaponKey(){
      return (hasRangedPrimary && weaponSel.style.display!=='none' && weaponSel.value==='fallback') ? 'dagger' : m.weapon;
    }
    function targetsInRange(){
      const weapon = WEAPONS[currentWeaponKey()];
      const maxRange = weapon.ranged ? RANGED_RANGE : 1;
      return mons.filter(mo=>mo.alive && hexDistance(effPos, mo.pos) <= maxRange);
    }
    // pick the previously-drafted option if it's still valid, else fall back to the first
    function restoreSelectValue(sel, preferred){
      if(preferred && [...sel.options].some(o=>o.value===preferred)) sel.value = preferred;
      else if(sel.options.length) sel.value = sel.options[0].value;
    }

    function refreshTargets(writeDraft){
      const type = typeSel.value;
      if(writeDraft) c.actions[m.id] = { type };
      spellSel.style.display='none';
      itemSel.style.display='none';
      weaponSel.style.display='none';
      if(type==='attack'){
        targetSel.style.display='';
        if(hasRangedPrimary){
          weaponSel.style.display='';
          weaponSel.innerHTML = `<option value="primary">${WEAPONS[m.weapon].name} (ranged)</option><option value="fallback">Dagger (melee)</option>`;
          restoreSelectValue(weaponSel, draft.type==='attack' ? draft.weaponChoice : null);
        }
        const inRange = targetsInRange();
        targetSel.innerHTML = inRange.length
          ? inRange.map(mo=>`<option value="${mo.name}">${mo.name}</option>`).join('')
          : `<option value="">No target in range</option>`;
        restoreSelectValue(targetSel, draft.type==='attack' ? draft.target : null);
        c.actions[m.id] = { type, target: targetSel.value, weaponKey: currentWeaponKey(), weaponChoice: hasRangedPrimary?weaponSel.value:undefined };
      } else if(type==='cast'){
        spellSel.style.display='';
        spellSel.innerHTML = m.spells.map(k=>`<option value="${k}">${SPELLS[k].name} (cost ${SPELLS[k].cost})</option>`).join('');
        restoreSelectValue(spellSel, draft.type==='cast' ? draft.spell : null);
        refreshSpellTarget(true);
      } else if(type==='item'){
        itemSel.style.display='';
        itemSel.innerHTML = usableItems.map(k=>`<option value="${k}">${ITEMS[k].name} x${state.inventory[k]}</option>`).join('');
        restoreSelectValue(itemSel, draft.type==='item' ? draft.itemKey : null);
        refreshItemTarget(true);
      } else {
        targetSel.style.display='none';
        c.actions[m.id] = { type };
      }
    }
    function refreshSpellTarget(preserveDraftTarget){
      const spell = SPELLS[spellSel.value];
      targetSel.style.display='';
      if(spell.kind==='attack' || spell.kind==='control'){
        targetSel.innerHTML = mons.filter(mo=>mo.alive).map(mo=>`<option value="${mo.name}">${mo.name}</option>`).join('');
        restoreSelectValue(targetSel, (preserveDraftTarget && draft.type==='cast' && draft.spell===spellSel.value) ? draft.target : null);
      } else if(spell.kind==='heal' || spell.kind==='buff'){
        targetSel.innerHTML = mercs.filter(p=>p.alive).map(p=>`<option value="${p.name}">${p.name}</option>`).join('');
        restoreSelectValue(targetSel, (preserveDraftTarget && draft.type==='cast' && draft.spell===spellSel.value) ? draft.target : null);
      } else {
        targetSel.style.display='none';
      }
      c.actions[m.id] = { type:'cast', spell: spellSel.value, target: targetSel.value };
    }
    function refreshItemTarget(preserveDraftTarget){
      const item = ITEMS[itemSel.value];
      if(item.kind==='revive'){
        const downed = state.party.slice(0,state.activeCount).filter(p=>!p.alive);
        targetSel.style.display='';
        targetSel.innerHTML = downed.length
          ? downed.map(p=>`<option value="${p.name}">${p.name}</option>`).join('')
          : `<option value="">No one is down</option>`;
        restoreSelectValue(targetSel, (preserveDraftTarget && draft.type==='item' && draft.itemKey===itemSel.value) ? draft.target : null);
      } else if(['heal','buff_hit','buff_def','buff_dmg','restore_focus'].includes(item.kind)){
        targetSel.style.display='';
        targetSel.innerHTML = mercs.filter(p=>p.alive).map(p=>`<option value="${p.name}">${p.name}</option>`).join('');
        restoreSelectValue(targetSel, (preserveDraftTarget && draft.type==='item' && draft.itemKey===itemSel.value) ? draft.target : null);
      } else {
        targetSel.style.display='none';
      }
      c.actions[m.id] = { type:'item', itemKey: itemSel.value, target: targetSel.value };
    }
    typeSel.onchange = ()=>refreshTargets(true);
    targetSel.onchange = ()=>{ c.actions[m.id].target = targetSel.value; };
    weaponSel.onchange = ()=>refreshTargets(false);
    spellSel.onchange = ()=>refreshSpellTarget(false);
    itemSel.onchange = ()=>refreshItemTarget(false);
    refreshTargets(false);
  });

  document.getElementById('resolveBtn').onclick = ()=>{
    mercs.forEach(m=>{
      const row = rowsEl.querySelector(`.actionrow[data-merc="${m.id}"]`);
      const type = row.querySelector('.actType').value;
      if(type==='attack'){
        const weaponSel = row.querySelector('.actWeapon');
        const weaponKey = (weaponSel.style.display!=='none' && weaponSel.value==='fallback') ? 'dagger' : m.weapon;
        c.actions[m.id] = {type:'attack', target: row.querySelector('.actTarget').value, weaponKey};
      } else if(type==='cast'){
        c.actions[m.id] = {type:'cast', spell: row.querySelector('.actSpell').value, target: row.querySelector('.actTarget').value};
      } else if(type==='item'){
        c.actions[m.id] = {type:'item', itemKey: row.querySelector('.actItem').value, target: row.querySelector('.actTarget').value};
      } else {
        c.actions[m.id] = {type:'defend'};
      }
    });
    resolveRound();

    if(livingMonsters().length===0){
      renderCombat(); // let the player actually see the final blow and fallen foes before moving on
      setTimeout(()=>{
        const room = getRoom(state.currentRoomId);
        const lines = [`The room falls silent — ${room.tag.split('—')[1]?.trim()||'the foes'} are defeated.`];
        state.runLog.push(lines[0]);
        if(room.gold){ const g=rollDice(room.gold); addGold(g); state.runLog.push(`+${g} gold.`); lines.push(`Found ${g} gold.`); }
        if(room.gems){ const gm=rollDice(room.gems); addGems(gm); state.runLog.push(`+${gm} gems.`); lines.push(`Found ${gm} gems.`); }
        if(room.item){ addItem(room.item); state.runLog.push(`Found: ${ITEMS[room.item].name}.`); lines.push(`Found: ${ITEMS[room.item].name}.`); }
        state.party.forEach(p=>{ p._potHit=0; p._potDef=0; p._potDmg=0; });
        const next = room.next;
        const doors = room.doors;
        state.combat=null;
        showRoomClear("VICTORY", lines, next, doors);
      }, 1100);
      return;
    }
    if(livingParty().length===0){
      renderCombat(); // same — show the party's own fallen before cutting to the defeat screen
      setTimeout(()=>{
        state.party.forEach(p=>{ p._potHit=0; p._potDef=0; p._potDmg=0; });
        state.view='end'; state.wipe=true; render();
      }, 1100);
      return;
    }
    render();
  };
}

const CLASS_FLAVOR = {
  fighter: "Steel and nerve — earned every silver piece the hard way.",
  wizard:  "Focus held to the very last spell. The keep remembers the flames.",
};

function renderEnd(){
  const roster = state.party.slice(0, state.activeCount);
  const survivors = roster.filter(p=>p.alive);
  const wipe = state.wipe;

  let cls, title, text;
  if(wipe || survivors.length===0){
    cls='bad';
    const room = getRoom(state.currentRoomId);
    const roomName = room ? roomDisplayName(room) : 'the dungeon';
    const depth = state.roomsCleared;
    if(BOSS_POOL[state.currentRoomId]){
      title='TOTAL DEFEAT — BROKEN AT THE THRONE';
      text = `${roomName} doesn't let you leave a second time. All four of you go down within arm's reach of the door you'd have walked through to end this — ${depth} rooms deep, one throne room short. By morning, King Lofstardt has already reposted the trial: four openings, no experience necessary. There's always a next crew willing to try the door.`;
    } else {
      title='TOTAL DEFEAT — THE KING CHOOSES ANOTHER PARTY';
      text = `${roomName} is where it ends — ${depth} room${depth===1?'':'s'} into the trial. King Lofstardt hires a new party by morning, same as always, and the rest of the dungeon stays exactly as dark as you found it.`;
    }
    SFX.defeat();
  } else if(survivors.length < state.activeCount){
    if(survivors.length===1){
      cls='mid'; title='PYRRHIC VICTORY — ONE WALKS OUT';
      text = `${survivors[0].name} crosses back through the trial door alone, carrying wounds and little else. King Lofstardt pays a full four-way share to a room with one person standing in it, and doesn't ask what that says about the other three. The keep is cleared. That's apparently enough.`;
    } else {
      cls='mid'; title='COSTLY VICTORY — LOSSES TAKEN';
      text = `${survivors.length} of ${state.activeCount} make it back through the door on their own legs. King Lofstardt pays the survivors' share in full, offers a short, practiced silence for the rest, and is already scheduling next season's trial before the ink's dry on this one's paperwork.`;
    }
    SFX.victory();
  } else {
    const avgHpPct = survivors.reduce((sum,p)=>sum+(p.hp/p.maxHp),0) / survivors.length;
    if(avgHpPct > 0.66){
      cls='good'; title='FLAWLESS VICTORY — FULL COMPANY';
      text = "All four of you stand over the wreckage of the King's final guardian without so much as a limp between you. King Lofstardt pays in full, smiles like it costs him something, and is visibly recalculating whether his oldest, cruelest test is still cruel enough. It probably won't be, next season.";
    } else {
      cls='good'; title='HARD-WON VICTORY — FULL COMPANY';
      text = "All four of you make it to the throne room and out again, bleeding in places you'll be finding out about for weeks. King Lofstardt pays in full and means it — the steward already has a fresh contract drawn up, your names filled in before you've even sat down.";
    }
    SFX.victory();
  }

  const rosterHTML = roster.map((p,i)=>{
    const alive = p.alive;
    const pct = alive ? Math.round(100*p.hp/p.maxHp) : 0;
    const barColor = pct>60?'#5c8a44':pct>25?'#c9a227':'#9c1f2e';
    const code = alive ? encodeCharacterCode(p) : null;
    return `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #3a322a;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div>
          <b style="${alive?'':'opacity:0.5;text-decoration:line-through;'}">${p.name}</b>
          <span class="small" style="opacity:0.7;"> — ${(p.cls||'fighter').charAt(0).toUpperCase()+(p.cls||'fighter').slice(1)}</span><br>
          <span class="small" style="opacity:0.65;font-style:italic;">${alive ? (CLASS_FLAVOR[p.cls]||CLASS_FLAVOR.fighter) : 'Fell before the end. Carried out, not walked out.'}</span>
        </div>
        <div style="text-align:right;min-width:64px;">
          ${alive
            ? `<span class="small" style="color:${barColor};font-weight:700;">${p.hp}/${p.maxHp} HP</span>`
            : `<span class="small" style="color:var(--blood);font-weight:700;">FALLEN</span>`}
        </div>
      </div>
      ${alive ? `<div class="small" style="display:flex;gap:6px;align-items:center;margin-top:6px;">
        <input readonly value="${code}" id="saveCode${i}" style="flex:1;min-width:0;background:#181310;color:#a89a82;border:1px solid #3a322a;padding:4px 6px;font-family:inherit;font-size:10.5px;">
        <button class="small-btn saveCodeBtn" data-i="${i}" style="white-space:nowrap;">Copy</button>
      </div>` : ''}
    </div>`;
  }).join('');

  const treasureValue = state.gold + state.gems*3;
  app.innerHTML = `
    <div class="panel" data-tag="final reckoning">
      <div class="ending-title ${cls}">${title}</div>
      <div class="scene-text" style="text-align:center;margin-bottom:16px;">${text}</div>
      <div style="margin-bottom:16px;">
        <div class="small" style="opacity:0.75;text-transform:uppercase;letter-spacing:1px;">The Company</div>
        ${rosterHTML}
      </div>
      <div class="small" style="text-align:center;margin-bottom:10px;">
        Gold recovered: <b style="color:var(--gold)">${state.gold}</b> &nbsp;·&nbsp; Gems recovered: <b style="color:#7fd0e0">${state.gems}</b><br>
        Total treasure value: <b style="color:var(--paper)">${treasureValue}</b> silver
      </div>
      <div class="log">FIELD LOG —<br>${state.runLog.map(l=>'· '+l).join('<br>')}</div>
      <button class="big-btn alt" id="retryBtn">Create A New Party</button>
    </div>
  `;
  document.querySelectorAll('.saveCodeBtn').forEach(btn=>{
    btn.onclick = ()=>{
      const input = document.getElementById(`saveCode${btn.dataset.i}`);
      input.select();
      const done = ()=>{ btn.textContent='Copied!'; setTimeout(()=>{ btn.textContent='Copy'; }, 1500); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(input.value).then(done).catch(()=>document.execCommand('copy') && done());
      } else {
        document.execCommand('copy'); done();
      }
    };
  });
  document.getElementById('retryBtn').onclick = ()=>{
    const wasMuted = state.muted;
    state = { view:'create', activeTab:0, party:makeParty(),
      activeCount:4, currentRoomId:'start', combat:null, runLog:[],
      gold:0, gems:0, inventory:{}, triggeredTraps:new Set(),
      visitedRooms:new Set(['start']), muted:wasMuted,
      roomsCleared:0, usedRoomIds:new Set(), junctions:{}, junctionCounter:0,
      dynamicRooms:{}, pendingBranch:null, chosenBossId:null, mapOpen:false };
    render();
  };
}

document.addEventListener('click', (e)=>{
  if(e.target.closest('button')) SFX.click();
});

document.getElementById('muteToggleBtn').onclick = ()=>{
  state.muted = !state.muted;
  const btn = document.getElementById('muteToggleBtn');
  btn.textContent = state.muted ? '🔇 Sound Off' : '🔊 Sound On';
  if(!state.muted) SFX.click();
};

render();
</script>
</body>
</html>
